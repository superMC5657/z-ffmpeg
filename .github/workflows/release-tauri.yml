# CD: Tauri Windows 单机打包与双清单发布
#
# 架构: 单机直通(打包+发布同机完成);配置严格外置于 release.env,门禁先行调用 ci.yml。
#
# 需要配置的 repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          = 私钥(base64)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 私钥密码(如有)
#   RELEASES_PAT                       = 对 RELEASES_REPO 具有写入权限的 GitHub PAT
name: Release Tauri

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (如 v0.2.0), 手动发布时必填'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  # 步骤 1: 先跑 CI 质量门禁 (质量没通过绝不浪费时间打包)
  ci:
    name: Run CI Verification
    uses: ./.github/workflows/ci.yml

  # 步骤 2: CI 通过后，单台 Windows 机器直接打包 EXE + 立即发布
  release:
    name: Build & Release Windows EXE
    needs: [ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Load config & validate tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::发布 tag 必须符合 SemVer 格式 (如 v0.1.0 或 v1.0.0-rc.1, 当前: $TAG)"
            exit 1
          fi

          if [ ! -f .github/release.env ]; then
            echo "::error::未找到配置文件 .github/release.env，请创建该文件并配置 APP_NAME 与 RELEASES_REPO"
            exit 1
          fi

          source .github/release.env
          if [ -z "$APP_NAME" ] || [ -z "$RELEASES_REPO" ]; then
            echo "::error::.github/release.env 必须配置非空的 APP_NAME 和 RELEASES_REPO"
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "RELEASES_REPO=$RELEASES_REPO" >> "$GITHUB_ENV"
          echo "已加载配置: APP_NAME=$APP_NAME, RELEASES_REPO=$RELEASES_REPO"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri bundle (signed)
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish to Release Repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          set -e
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::未找到 windows-x86_64 安装包"
            exit 1
          fi
          SAFE=$(basename "$EXE" | tr ' ' '.')
          ASSETS_JSON="[{\"target\":\"windows-x86_64\",\"file\":\"$SAFE\"}]"
          NOTES="$APP_NAME $TAG 安装包与双区更新清单（latest.json 海外直链 / latest-cn.json 镜像加速）。客户端 updater 按端点顺序自动回落检测。"
          
          mkdir -p artifacts/windows-x86_64
          cp "$EXE" "artifacts/windows-x86_64/$SAFE"
          if [ -f "$EXE.sig" ]; then
            cp "$EXE.sig" "artifacts/windows-x86_64/$SAFE.sig"
          fi

          # 双区清单(均带扩展字段,updater 忽略未知字段;仅 URL 前缀不同):海外直链 latest.json / 镜像加速 latest-cn.json
          node scripts/build-latest-json.mjs \
            --name "$APP_NAME" \
            --repo "$RELEASES_REPO" \
            --tag "$TAG" \
            --assets "$ASSETS_JSON" \
            --dir artifacts \
            --proxy-prefix "" \
            --extended \
            --output artifacts/latest.json

          node scripts/build-latest-json.mjs \
            --name "$APP_NAME" \
            --repo "$RELEASES_REPO" \
            --tag "$TAG" \
            --assets "$ASSETS_JSON" \
            --dir artifacts \
            --extended \
            --output artifacts/latest-cn.json

          # 已存在则覆盖更新资产
          cd artifacts
          FILES=()
          while IFS= read -r -d '' f; do FILES+=("$f"); done < <(find . -type f -print0)

          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，原地覆盖更新资产..."
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$RELEASES_REPO"
            gh release edit "$TAG" \
              --repo "$RELEASES_REPO" \
              --title "$APP_NAME $TAG" \
              --notes "$NOTES" \
              --latest
          else
            echo "创建全新 Release $TAG..."
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$RELEASES_REPO" \
              --title "$APP_NAME $TAG" \
              --notes "$NOTES" \
              --latest
          fi
